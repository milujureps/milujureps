<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>milujureps</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#4f46e5;
    filter:blur(180px);
    opacity:.35;
    top:-150px;
    left:-150px;
}

body::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#06b6d4;
    filter:blur(180px);
    opacity:.25;
    bottom:-150px;
    right:-150px;
}

.container{
    position:relative;
    z-index:10;
    width:90%;
    max-width:600px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    padding:60px 40px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
    color:white;
    font-size:clamp(2.5rem,6vw,4.5rem);
    margin-bottom:40px;
    font-weight:700;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.btn{
    text-decoration:none;
    color:white;
    padding:18px;
    border-radius:16px;
    font-size:1.05rem;
    font-weight:600;
    transition:.25s;
    background:linear-gradient(135deg,#6366f1,#3b82f6);
    box-shadow:0 10px 30px rgba(99,102,241,.35);
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 18px 40px rgba(99,102,241,.45);
}

.btn.secondary{
    background:linear-gradient(135deg,#14b8a6,#06b6d4);
    box-shadow:0 10px 30px rgba(6,182,212,.35);
}

.btn.secondary:hover{
    box-shadow:0 18px 40px rgba(6,182,212,.45);
}

.footer{
    margin-top:35px;
    color:#cbd5e1;
    font-size:.9rem;
}

@media (max-width:600px){

.container{
    padding:40px 25px;
}

.btn{
    font-size:1rem;
    padding:16px;
}

}
</style>

</head>
<body>

<div class="container">

<h1>milujureps</h1>

<div class="buttons">

<a class="btn"
href="https://discord.gg/QyNpHN3Yd9"
target="_blank">
Připoj se na náš Discord server
</a>

<a class="btn secondary"
href="https://ikako.vip/r/yyyyy"
target="_blank">
Kakobuy Kupóny
</a>

</div>

<div class="footer">
© 2026 milujureps
</div>

</div>

</body>
</html>
